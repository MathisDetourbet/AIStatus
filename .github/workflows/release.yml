name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build & Test
        run: |
          xcodebuild test \
            -scheme AIStatus-Package \
            -destination 'platform=macOS'

  build-and-release:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal binaries
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Create .app bundle
        run: ./scripts/bundle-app.sh "${{ steps.version.outputs.VERSION }}"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

      - name: Sign app
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./scripts/sign-app.sh build/AIStatusBar.app

      - name: Notarize and staple app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ./scripts/notarize-app.sh build/AIStatusBar.app \
            "dist/AIStatusBar-${VERSION}-macos-universal.zip"

      - name: Create CLI archive
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.VERSION }}"
          tar -czf "dist/aistatus-${VERSION}-macos-universal.tar.gz" \
            -C .build/apple/Products/Release aistatus

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 *.zip *.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AIStatusBar-*.zip
            dist/aistatus-*.tar.gz
            dist/checksums-sha256.txt

      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          formula-name: aistatus
          homebrew-tap: MathisDetourbet/homebrew-tap
          download-url: https://github.com/MathisDetourbet/AIStatus/releases/download/${{ github.ref_name }}/aistatus-${{ steps.version.outputs.VERSION }}-macos-universal.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          APP_SHA=$(shasum -a 256 dist/AIStatusBar-${VERSION}-macos-universal.zip | awk '{print $1}')

          # Fetch current cask file from tap repo
          CURRENT=$(curl -s -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            https://api.github.com/repos/MathisDetourbet/homebrew-tap/contents/Casks/aistatusbar.rb)
          FILE_SHA=$(echo "$CURRENT" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")

          # Generate updated cask content
          CASK_CONTENT=$(cat <<'CASK'
          cask "aistatusbar" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"

            url "https://github.com/MathisDetourbet/AIStatus/releases/download/v#{version}/AIStatusBar-#{version}-macos-universal.zip"
            name "AIStatusBar"
            desc "Menu bar app showing AI service status"
            homepage "https://github.com/MathisDetourbet/AIStatus"

            depends_on macos: :sequoia

            app "AIStatusBar.app"

            zap trash: [
              "~/Library/Preferences/com.mathisdetourbet.AIStatusBar.plist",
            ]
          end
          CASK
          )
          CASK_CONTENT="${CASK_CONTENT//VERSION_PLACEHOLDER/$VERSION}"
          CASK_CONTENT="${CASK_CONTENT//SHA_PLACEHOLDER/$APP_SHA}"
          ENCODED=$(echo -n "$CASK_CONTENT" | base64)

          # Push updated cask to tap repo
          curl -s -X PUT \
            -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/MathisDetourbet/homebrew-tap/contents/Casks/aistatusbar.rb \
            -d "{\"message\":\"aistatusbar ${VERSION}\",\"content\":\"${ENCODED}\",\"sha\":\"${FILE_SHA}\"}"

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
